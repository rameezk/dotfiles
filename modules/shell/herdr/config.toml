onboarding = false
[theme]
auto_switch = true
dark_name = "rose-pine"
light_name = "rose-pine-dawn"

[update]
version_check = false

[keys]
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
next_agent = "prefix+shift+down"
previous_agent = "prefix+shift+up"
copy_mode = "prefix+["

# plugin: herdr plugin install rmarganti/herdr-pluck -y
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "rmarganti.herdr-pluck.open-url"
description = "open visible URL"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"
description = "pluck visible token"

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "priority"
mouse_scroll_lines = 6
